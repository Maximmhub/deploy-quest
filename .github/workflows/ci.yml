name: Deploy Quest CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check that steps.json is valid
        run: python -c "import json; json.load(open('steps.json', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest -v

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Upload tested application
        uses: actions/upload-artifact@v7
        with:
          name: deploy-quest
          path: |
            app_final.py
            steps.json
            static/
            requirements.txt
            .env.example
            README.md
          retention-days: 7
