# Nginx: reverse proxy с порта 80 (и 443 после certbot) на приложение 127.0.0.1:8000.
# Установка:  sudo cp deploy/nginx-deploy-quest.conf /etc/nginx/sites-available/deploy-quest
#             sudo ln -s /etc/nginx/sites-available/deploy-quest /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
# Замените quest.example.ru на свой домен.

server {
    listen 80;
    server_name quest.example.ru;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
